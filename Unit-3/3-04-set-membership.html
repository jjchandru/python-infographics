<body>
  <div class="page-header">
    <h1>UNIT 3.3 - SETS</h1>
    <span class="page-number">(4)</span>
  </div>
  <p class="subtitle">Checking whether a value exists in a set</p>

  <section class="box">
    <h2>EXAMPLE</h2>
    <pre class="code">cart = {"pen", "notebook", "eraser"}

print("pen" in cart)
print("marker" in cart)

Output:
<span class="out">True
False</span></pre>
  </section>

  <section class="box">
    <h2>EXPLANATION</h2>
    <ul>
      <li><code class="code-small">in</code> checks whether a value exists in the set, returns True or False.</li>
      <li><code class="code-small">not in</code> is the opposite check.</li>
    </ul>
  </section>
