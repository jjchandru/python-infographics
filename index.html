<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Python</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ancizar+Sans:ital,wght@0,100..1000;1,100..1000&family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    padding: 0;
    font-family: "Ancizar Sans", "Segoe UI", Arial, sans-serif;
    background: #f2f6fb;
  }

  body {
    min-height: 100vh;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 20px 0;
  }

  .stage {
    width: 100%;
    max-width: 450px;
    box-sizing: border-box;
    margin: 0 auto;
    padding: 0 5px;
  }

  #menu {
    background: #fff;
    border: 3px solid #4a7ab5;
    border-radius: 4px;
    box-sizing: border-box;
    padding: 4px 16px 16px;
  }

  #menu h1 {
    text-align: center;
    color: #1a3a5c;
    font-size: 1.2em;
  }

  #menu h2 {
    background: #dce9f7;
    color: #1a3a5c;
    margin: 18px 0 8px;
    padding: 8px 12px;
    font-size: 1.2em;
    border-radius: 4px;
  }

  #menu ul {
    margin: 0;
    padding: 0;
    list-style: none;
  }

  #menu li {
    border-bottom: 1px solid #dce9f7;
  }

  #menu li:last-child {
    border-bottom: none;
  }

  #menu li a {
    display: block;
    /* padding: 9px 4px; */
    color: #1a3a5c;
    font-family: "Ancizar Sans", "Segoe UI Semibold", Arial, sans-serif;
    text-decoration: underline;
  }

  #menu li a:hover {
    background: #f2f6fb;
  }

  #viewer {
    display: block;
    width: 100%;
    border: none;
    margin: 0;
  }

  .nav-bar {
    display: flex;
    align-items: center;
    gap: 16px;
    width: 100%;
    box-sizing: border-box;
    padding: 8px 0;
    margin-top: 8px;
  }

  .nav-bar button {
    flex: 1;
    font-family: "Ancizar Sans", "Segoe UI Semibold", Arial, sans-serif;
    font-size: 1.2em;
    padding: 8px 18px;
    border: none;
    border-radius: 4px;
    background: #4a7ab5;
    color: #fff;
    cursor: pointer;
  }

  .nav-bar button:disabled {
    background: #7a93ab;
    cursor: not-allowed;
  }

  .nav-bar button:not(:disabled):hover {
    background: #2a5a8c;
  }

  #homeBtn {
    flex: 0.7;
  }

  .page-indicator {
    text-align: center;
    font-family: "Consolas", monospace;
    font-size: 0.85em;
    color: #4a7ab5;
    font-weight: bold;
    margin-top: 8px;
  }
</style>
</head>
<body>

  <div class="stage">
    <div id="menu">
      <h1>Python</h1>
      <div id="menuGroups"></div>
    </div>

    <div id="viewer" style="display: none;"></div>

    <div class="nav-bar" id="viewerNav" style="display: none;">
      <button id="homeBtn">Home</button>
      <button id="prevBtn">&larr; Previous</button>
      <button id="nextBtn">Next &rarr;</button>
    </div>

    <div class="page-indicator" id="pageIndicator" style="display: none;"></div>
  </div>

<script>
  var unit1Files = [
    "2-01-variables.html",
    "2-02-identifier.html",
    "2-03-type-function.html",
    "3-01-arith-ops.html",
    "3-02-arith-ops.html",
    "3-03-comp-ops.html",
    "3-04-logical-ops.html",
    "3-05-truthy-falsy.html",
    "4-01-statements.html",
    "4-02-tuple-unpacking.html",
    "4-03-string-quotes.html",
    "4-04-string-index.html",
    "4-05-fstring-part1.html",
    "4-06-fstring-part2.html",
    "4-07-fstring-exercise.html"
  ];

  var unit2Files = [
    "1-01-if.html",
    "1-02-if-else.html",
    "1-03-if-elif-else-syntax.html",
    "1-04-if-elif-else-example.html",
    "1-05-cond-expr-syntax.html",
    "1-06-cond-expr-example.html",
    "2-01-while-syntax.html",
    "2-02-while-example.html",
    "2-03-while-steps.html",
    "2-04-for-options.html",
    "2-05-for-sequence-syntax.html",
    "2-06-for-sequence-example.html",
    "2-07-for-sequence-steps.html",
    "2-08-for-range-options.html",
    "2-09-for-range-1-param.html",
    "2-10-for-range-2-params.html",
    "2-11-for-range-3-params.html",
    "2-12-for-enumerate.html",
    "2-13-for-zip.html",
    "2-14-loop-break-syntax.html",
    "2-15-loop-break-example.html",
    "2-16-loop-continue-syntax.html",
    "2-17-loop-continue-example.html",
    "2-18-loop-nested-loop.html",
    "2-19-loop-nested-loop-solution.html",
    "3-01-simple-function-syntax.html",
    "3-02-simple-function-example.html",
    "3-03-function-params-return-puzzle.html",
    "3-04-function-params-return-syntax.html",
    "3-05-args-puzzle.html",
    "3-06-args-explained.html",
    "3-07-kwargs-intro.html",
    "3-08-local-global-variables-puzzle.html",
    "3-09-local-global-variables-explained.html",
    "3-10-recursion.html",
    "3-11-docstring.html"
  ];

  var unit3Files = [
    "1-01-list-create-index-puzzle.html",
    "1-02-list-create-index-syntax.html",
    "1-03-list-slicing-step-puzzle.html",
    "1-04-list-slicing-step-syntax.html",
    "1-05-list-mutability-explained.html",
    "1-06-list-methods-puzzle.html",
    "1-07-objects-attributes-functions.html",
    "1-08-list-methods.html",
    "1-09-list-looping-example.html",
    "1-10-list-sorting.html",
    "1-11-lambda-puzzle.html",
    "1-12-lamba-transformation.html",
    "1-13-sorting-lambda-puzzle.html",
    "1-14-filter-lambda-puzzle.html",
    "1-15-map-lambda-puzzle.html",
    "1-16-nested-list-example.html",
    "1-17-list-comprehension-example.html",
    "2-01-tuple-create-puzzle.html",
    "2-02-tuple-create-puzzle-output.html",
    "2-03-tuple-packing-unpacking-example.html",
    "2-04-tuple-index-unpacking-comparison.html",
    "2-05-tuple-nested-example.html",
    "2-06-tuple-operations.html",
    "3-01-set-create-uniqueness-puzzle.html",
    "3-02-set-create-uniqueness-puzzle-output.html",
    "3-03-set-operations.html",
    "3-04-set-membership.html",
    "3-05-set-add.html",
    "3-06-set-remove.html",
    "3-07-set-discard.html",
    "3-08-set-comprehension.html",
    "4-01-dict-intro.html",
    "4-02-dict-explanation.html",
    "4-03-dict-create.html",
    "4-04-dict-add.html",
    "4-05-dict-modify.html",
    "4-06-dict-del.html",
    "4-07-dict-pop.html",
    "4-08-dict-loop-items.html",
    "4-09-dict-loop-keys.html",
    "4-10-dict-loop-values.html",
    "4-11-dict-sorting.html",
    "4-12-dict-nested.html",
    "4-13-dict-get.html",
    "4-14-dict-setdefault.html",
    "4-15-dict-accumulate-get.html",
    "4-16-dict-count-fruit-problem.html",
    "4-17-dict-count-fruit-solution.html",
    "4-18-dict-fruit-names-problem.html",
    "4-19-dict-fruit-names-solution.html",
    "4-20-dict-comprehension.html",
    "5-01-iter-example.html",
    "5-02-generator-example.html",
    "5-03-sensor-generator-problem.html",
    "5-04-sensor-generator-solution.html",
    "5-05-counter-example.html",
    "5-06-defaultdict-example.html",
    "5-07-namedtuple-example.html"
  ];

  var unit5Files = [
    "1-01-read-file.html",
    "1-02-write-file.html",
    "1-03-append-file.html",
    "1-04-read-write-mode.html",
    "1-05-library-package-module-import.html",
    "1-06-read-csv.html",
    "1-07-read-json.html",
    "2-01-exception-scenario.html",
    "2-02-exception-program-output.html",
    "2-03-console-crash-questions.html",
    "2-04-try-except-basic.html",
    "2-05-try-except-while-loop.html",
    "2-06-exception-handling-test.html",
    "2-07-exception-handling-answer.html",
    "2-08-syntax-error-puzzle.html",
    "2-09-syntax-error-explanation.html",
    "2-10-syntax-vs-exception.html",
    "2-11-exception-hierarchy.html",
    "2-12-try-except-else-finally.html",
    "2-13-grouped-exceptions.html",
    "2-14-common-exceptions.html",
    "2-15-raising-exceptions.html"
  ];

  var pages = unit1Files.map(function (f) { return "Unit-1/" + f; })
    .concat(unit2Files.map(function (f) { return "Unit-2/" + f; }))
    .concat(unit3Files.map(function (f) { return "Unit-3/" + f; }))
    .concat(unit5Files.map(function (f) { return "Unit-5/" + f; }));

  function pageLabel(filename) {
    var name = filename.replace(/\.html$/, "");
    var parts = name.split("-");
    var subId = parts[1];
    var title = parts.slice(2).join(" ");
    title = title.charAt(0).toUpperCase() + title.slice(1);
    // return subId + " " + title;
    return title;
  }

  var menuEl = document.getElementById("menu");
  var menuGroups = document.getElementById("menuGroups");
  var stageEl = document.querySelector(".stage");
  var viewer = document.getElementById("viewer");
  var viewerNav = document.getElementById("viewerNav");
  var homeBtn = document.getElementById("homeBtn");
  var prevBtn = document.getElementById("prevBtn");
  var nextBtn = document.getElementById("nextBtn");
  var pageIndicator = document.getElementById("pageIndicator");

  var viewerShadow = viewer.attachShadow({ mode: "open" });
  var viewerStyleLink = document.createElement("link");
  viewerStyleLink.rel = "stylesheet";
  viewerStyleLink.href = "styles.css";
  var viewerHostStyle = document.createElement("style");
  viewerHostStyle.textContent = ":host { display: block; font-family: 'Segoe UI', Arial, sans-serif; color: #1a3a5c; }";
  var viewerContent = document.createElement("div");
  viewerShadow.appendChild(viewerStyleLink);
  viewerShadow.appendChild(viewerHostStyle);
  viewerShadow.appendChild(viewerContent);

  function buildMenu(unitNumber, files, folder) {
    var topicOrder = [];
    var topicGroups = {};

    files.forEach(function (f) {
      var topic = f.split("-")[0];
      if (!topicGroups[topic]) {
        topicGroups[topic] = [];
        topicOrder.push(topic);
      }
      topicGroups[topic].push(f);
    });

    topicOrder.forEach(function (topic) {
      var h2 = document.createElement("h2");
      h2.textContent = "Unit " + unitNumber + "." + topic;
      menuGroups.appendChild(h2);

      var ul = document.createElement("ul");
      topicGroups[topic].forEach(function (f) {
        var pageIndex = pages.indexOf(folder + "/" + f);
        var li = document.createElement("li");
        var a = document.createElement("a");
        a.href = "#";
        a.textContent = pageLabel(f);
        a.addEventListener("click", function (e) {
          e.preventDefault();
          goToPage(pageIndex);
        });
        li.appendChild(a);
        ul.appendChild(li);
      });
      menuGroups.appendChild(ul);
    });
  }

  buildMenu(1, unit1Files, "Unit-1");
  buildMenu(2, unit2Files, "Unit-2");
  buildMenu(3, unit3Files, "Unit-3");
  buildMenu(5, unit5Files, "Unit-5");

  var currentIndex = 0;

  function render() {
    prevBtn.disabled = currentIndex === 0;
    nextBtn.disabled = currentIndex === pages.length - 1;
    fetch(pages[currentIndex])
      .then(function (res) { return res.text(); })
      .then(function (html) {
        var doc = new DOMParser().parseFromString(html, "text/html");
        var pageNumEl = doc.body.querySelector(".page-number");
        pageIndicator.textContent = pageNumEl ? pageNumEl.textContent : "";
        if (pageNumEl) {
          pageNumEl.remove();
        }
        var pageStyles = Array.prototype.map.call(doc.querySelectorAll("head style"), function (el) {
          return el.textContent;
        }).join("\n");
        viewerContent.innerHTML = (pageStyles ? "<style>" + pageStyles + "</style>" : "") + doc.body.innerHTML;
      })
      .catch(function () {
        viewerContent.innerHTML = "<p>Unable to load page.</p>";
        pageIndicator.textContent = "";
      });
  }

  function showMenu() {
    menuEl.style.display = "";
    viewer.style.display = "none";
    viewerNav.style.display = "none";
    pageIndicator.style.display = "none";
  }

  function showViewer() {
    menuEl.style.display = "none";
    viewer.style.display = "block";
    viewerNav.style.display = "flex";
    pageIndicator.style.display = "block";
  }

  function goToPage(index) {
    currentIndex = index;
    showViewer();
    render();
  }

  homeBtn.addEventListener("click", showMenu);

  prevBtn.addEventListener("click", function () {
    if (currentIndex > 0) {
      currentIndex--;
      render();
    }
  });

  nextBtn.addEventListener("click", function () {
    if (currentIndex < pages.length - 1) {
      currentIndex++;
      render();
    }
  });

  showMenu();
</script>

</body>
</html>
