  <section class="box">
    <h2>EXAMPLE - IF ELIF ELSE</h2>
    <pre class="code">marks = 72

if <span class="field">marks &gt;= 90</span>:
    print("Grade A")
elif <span class="field">marks &gt;= 70</span>:
    print("Grade B")
elif <span class="field">marks &gt;= 40</span>:
    print("Grade C")
else:
    print("Fail")

Output:
<span class="out">Grade B</span></pre>
