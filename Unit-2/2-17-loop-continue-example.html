<!DOCTYPE html>

<title>Python - Continue Statement Example</title>

<body>
  <div class="page-header">
    <h1>UNIT 2.2 - LOOPS</h1>
    <span class="page-number">(17)</span>
  </div>
  <p class="subtitle">Skips the current iteration and continues with the next one.</p>

  <section class="box">
    <h2>EXAMPLE</h2>
    <pre class="code">for num in range(1, 11):
    if num == 5 or num == 8:
        <span class="keyword">continue</span>
    print(num)

Output:
<span class="out">1
2
3
4
6
7
9
10</span></pre>
    <p class="note">Numbers 5 and 8 are skipped; loop continues with remaining numbers.</p>
  </section>
</body>
</html>
