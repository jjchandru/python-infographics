<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Python - For Range (1 Param)</title>
<link rel="stylesheet" href="../styles.css">
</head>
<body>
  <div class="page-header">
    <h1>UNIT 2.2 - LOOPS</h1>
    <span class="page-number">(9)</span>
  </div>
  <p class="subtitle">range(stop) &mdash; counts from 0 up to stop, exclusive.</p>

  <section class="box">
    <h2>SYNTAX - RANGE(STOP)</h2>
    <pre class="code">for <span class="field">{loop_variable}</span> in <span class="op">range({stop})</span>:
    {statement(s)}</pre>
    <dl>
      <dt class="op">range({stop})</dt><dd> starts at 0, increments by 1 till stop - 1</dd>
    </dl>
  </section>

  <section class="box">
    <h2>EXAMPLE</h2>
    <pre class="code">for <span class="field">i</span> in <span class="op">range(5)</span>:
    print(i)

Output:
<span class="out">0
1
2
3
4</span></pre>
  </section>
</body>
</html>
