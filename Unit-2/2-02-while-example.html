<body>
  <div class="page-header">
    <h1>UNIT 2.2 - LOOPS</h1>
    <span class="page-number">(2)</span>
  </div>
  <p class="subtitle">Repeats a code block while condition stays True.</p>

  <section class="box">
    <h2>EXAMPLE - WHILE</h2>
    <pre class="code">count = 1

while <span class="field">count &lt;= 3</span>:
    print(count)
    count += 1

Output:
<span class="out">1
2
3</span></pre>
  </section>
</body>
