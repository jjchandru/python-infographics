<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Python - Break Statement Example</title>
<link rel="stylesheet" href="../styles.css">
</head>
<body>
  <div class="page-header">
    <h1>UNIT 2.2 - LOOPS</h1>
    <span class="page-number">(15)</span>
  </div>
  <p class="subtitle">Exits the loop immediately, skipping remaining iterations.</p>

  <section class="box">
    <h2>EXAMPLE</h2>
    <pre class="code">count = 1

while count &lt;= 10:
    if count == 5:
        <span class="keyword">break</span>
    print(count)
    count += 1

Output:
<span class="out">1
2
3
4</span></pre>
    <p class="note">Loop stops at 5, never prints 5 or beyond.</p>
  </section>
</body>
</html>
